rules:
  - id: commands-literal-wrapper
    pattern: 'Commands\.literal\('
    applies_to: "target>=1.19"
    loader:
      - forge
      - neoforge
    issue: "O uso de Commands.literal() pode falhar em determinados cenários de mapeamento/reobfuscação."
    suggestion: "Revisar o uso direto de com.mojang.brigadier.builder.LiteralArgumentBuilder.literal()."
    severity: medium
    confidence: 0.60
    references:
      - "PLANO_FERRAMENTA_PORTE_MODS.md:32-45"
    match_in: code
    category: COMMANDS
    migration_type: manual_review
    affected_packages:
      - com.mojang.brigadier
    affected_methods:
      - Commands.literal
    breaking_change: true
    automatable: false
    automation_safety: manual_review
    before: "Commands.literal(\"name\")"
    after: "LiteralArgumentBuilder.literal(\"name\")"
    suggestion_object:
      type: replace_method
      old: "Commands.literal"
      new: "LiteralArgumentBuilder.literal"
      automatable: false
      automation_safety: manual_review

  - id: model-event-change
    patterns:
      - '\bBakedModelWrapper\b'
      - '\bModelBakeEvent\b'
    source_versions:
      min: "1.19"
      max: "1.20.1"
    target_versions:
      min: "1.21"
    loader:
      - forge
      - neoforge
    issue: "O sistema de modelos e eventos de baking mudou no contexto de migração para 1.21."
    suggestion: "Revisar a migração para ModelEvent.ModifyBakingResult conforme a API e o loader usados."
    severity: high
    confidence: 0.85
    references:
      - "https://docs.neoforged.net/primer/docs/1.21/"
    category: RENDERING
    migration_type: change_event
    replacement_api: ModelEvent.ModifyBakingResult
    affected_classes:
      - BakedModelWrapper
      - ModelBakeEvent
    requires_ast: true
    requires_dependency_check: true
    automatable: false
    automation_safety: manual_review
    before: "@SubscribeEvent void onBake(ModelBakeEvent event)"
    after: "@SubscribeEvent void onBake(ModelEvent.ModifyBakingResult event)"
    suggestion_object:
      type: manual_migration
      old: "ModelBakeEvent"
      new: "ModelEvent.ModifyBakingResult"
      automatable: false
      automation_safety: manual_review
    match_in: code
